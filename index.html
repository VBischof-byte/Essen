<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Speisenauswahl</title>
    <style>
        /* Grunddesign */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        
        /* Eingabebereich */
        .input-section { 
            max-width: 650px; margin: 0 auto 30px; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219150; }

        /* Spalten-Layout */
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .column { background: white; padding: 20px; border-radius: 12px; width: 320px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 400px; }
        h2 { border-bottom: 3px solid #27ae60; padding-bottom: 10px; color: #2c3e50; }
        
        /* Liste */
        ul { list-style: none; padding: 0; }
        li { 
            padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
        }
        li:hover { background: #f9f9f9; color: #2980b9; }
        .recipe-icon { margin-left: 8px; font-size: 1.2em; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        /* Modal für Rezept-Bilder */
        .modal { display: none; position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); text-align: center; }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 85%; margin-top: 40px; border: 5px solid white; border-radius: 10px; }
        .close { position: absolute; top: 15px; right: 35px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; }
    </style>
</head>

            <option value="suess">Süß</option>
        </select>
        <input type="text" id="recipeLink" placeholder="z.B. pizza.jpg">
        <button onclick="addFood()">Hinzufügen</button>
    </div>

    <div class="container">
        <div class="column">
            <h2>Herzhaft</h2>
            <ul id="herzhaft-list"></ul>
        </div>

        <div class="column">
            <h2>Süß</h2>
            <ul id="suess-list"></ul>
        </div>
    </div>

    <div id="recipeModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="recipeImg">
    </div>
