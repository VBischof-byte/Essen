<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Rezeptbuch</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        
        .input-section { 
            max-width: 800px; margin: 0 auto 30px; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-add { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }

        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .column { background: white; padding: 20px; border-radius: 12px; flex: 1; min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 3px solid #27ae60; padding-bottom: 10px; color: #2c3e50; margin-top: 0; }
        
        ul { list-style: none; padding: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .item-left { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-grow: 1; }
        .icons { font-size: 1.2em; display: flex; gap: 5px; }
        
        .btn-plus { background: #3498db; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .btn-delete { background: #ff4757; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 10px; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { 
            background: white; width: 90%; max-width: 500px; margin: 50px auto; padding: 25px; 
            border-radius: 15px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        textarea { width: 100%; height: 200px; margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: vertical; }
        .modal-img { display: block; max-width: 95%; max-height: 80vh; margin: 40px auto; border: 5px solid white; border-radius: 10px; }
        .close-btn { float: right; cursor: pointer; font-size: 24px; font-weight: bold; }
        .save-btn { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Sicherung Buttons */
        .backup-section { text-align: center; margin-top: 40px; padding: 20px; border-top: 1px solid #ddd; }
        .btn-backup { background: #7f8c8d; color: white; border: none; padding: 10px; margin: 5px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Speisenauswahl</h1>

    <div class="input-section">
        <input type="text" id="foodName" placeholder="Neues Gericht Name">
        <select id="foodCategory">
            <option value="herzhaft">Herzhaft</option>
            <option value="suess">Süß</option>
        </select>
        <button class="btn-add" onclick="addFood()">Hinzufügen</button>
    </div>

    <div class="container">
        <div class="column">
            <h2>Herzhaft</h2>
            <ul id="herzhaft-list"></ul>
        </div>
        <div class="column">
            <h2>Süß</h2>
            <ul id="suess-list"></ul>
        </div>
    </div>

    <div class="backup-section">
        <button class="btn-backup" onclick="exportData()">📥 Liste als Datei sichern</button>
        <button class="btn-backup" onclick="document.getElementById('fileInput').click()">📤 Sicherung wiederherstellen</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    </div>

    <div id="editorModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEditor()">&times;</span>
            <h3 id="editTitle">Rezept bearbeiten</h3>
            <label>Bild-Dateiname (z.B. Milchreis.jpg):</label>
            <input type="text" id="editImgPath" placeholder="z.B. Milchreis.jpg" style="width:100%; margin-top:5px;">
            
            <label style="display:block; margin-top:15px;">Zubereitung / Rezept-Text:</label>
            <textarea id="editText" placeholder="Schreibe hier dein Rezept rein..."></textarea>
            
            <button class="save-btn" onclick="saveData()">Speichern</button>
        </div>
    </div>

    <div id="viewModal" class="modal">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
            <span class="close-btn" onclick="closeView()">&times;</span>
            <h2 id="viewTitle"></h2>
            <div id="viewText" style="white-space: pre-wrap; line-height: 1.6; background: #f9f9f9; padding: 15px; border-radius: 8px;"></div>
            <img id="viewImg" class="modal-img" style="display:none; width: 100%; margin-top: 15px;">
        </div>
    </div>

    <script>
        const standardSpeisen = {
            herzhaft: ["Bratwurst", "Frühlingsrollen", "Hofmanns", "Kartoffeln mit Quark", "Kartoffelpuffer", "Nudelauflauf", "Ofengemüse", "Pizza", "Salat", "Selbstgemachte Pizza", "Steak", "Suppen", "TK-Speisen", "Zucchini"],
            suess: ["Gebratene Bananen", "Griesbrei", "Kaiserschmarrn", "Milchreis", "Ofenpfannkuchen", "Quarkbällchen", "Schmalzgebäck", "Waffeln"]
        };

        let initialData = { herzhaft: [], suess: [] };
        for(let cat in standardSpeisen) {
            initialData[cat] = standardSpeisen[cat].map(name => ({
                name: name,
                img: (name === "Milchreis" || name === "Griesbrei") ? name + ".jpg" : "",
                text: ""
            }));
        }

        let speisen = JSON.parse(localStorage.getItem('kochbuch_daten')) || initialData;
        let activeIdx = { cat: '', index: -1 };

        function render() {
            ['herzhaft', 'suess'].forEach(cat => {
                const el = document.getElementById(cat + '-list');
                el.innerHTML = "";
                speisen[cat].sort((a,b) => a.name.localeCompare(b.name));

                speisen[cat].forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="item-left" onclick="showRecipe('${cat}', ${index})">
                            <span>${item.name}</span>
                            <div class="icons">
                                ${item.img ? '📖' : ''}
                                ${item.text ? '📝' : ''}
                            </div>
                        </div>
                        <div>
                            <button class="btn-plus" onclick="openEditor('${cat}', ${index})">+</button>
                            <button class="btn-delete" onclick="deleteFood('${cat}', ${index})">Löschen</button>
                        </div>
                    `;
                    el.appendChild(li);
                });
            });
        }

        function openEditor(cat, index) {
            activeIdx = { cat, index };
            const item = speisen[cat][index];
            document.getElementById('editTitle').innerText = item.name;
            document.getElementById('editImgPath').value = item.img || "";
            document.getElementById('editText').value = item.text || "";
            document.getElementById('editorModal').style.display = "block";
        }

        function saveData() {
            const item = speisen[activeIdx.cat][activeIdx.index];
            item.img = document.getElementById('editImgPath').value;
            item.text = document.getElementById('editText').value;
            localStorage.setItem('kochbuch_daten', JSON.stringify(speisen));
            render();
            closeEditor();
        }

        function exportData() {
            const dataStr = JSON.stringify(speisen);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = 'rezept_sicherung.json';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function importData(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(imported.herzhaft && imported.suess) {
                        speisen = imported;
                        localStorage.setItem('kochbuch_daten', JSON.stringify(speisen));
                        render();
                        alert("Sicherung erfolgreich geladen!");
                    }
                } catch(err) { alert("Fehler beim Laden der Datei."); }
            };
            reader.readAsText(event.target.files[0]);
        }

        function showRecipe(cat, index) {
            const item = speisen[cat][index];
            if(!item.img && !item.text) { openEditor(cat, index); return; }
            document.getElementById('viewTitle').innerText = item.name;
            document.getElementById('viewText').innerText = item.text || "Kein Rezepttext hinterlegt.";
            const img = document.getElementById('viewImg');
            if(item.img) { img.src = item.img; img.style.display = "block"; } else { img.style.display = "none"; }
            document.getElementById('viewModal').style.display = "block";
        }

        function addFood() {
            const name = document.getElementById('foodName').value;
            const cat = document.getElementById('foodCategory').value;
            if(name) {
                speisen[cat].push({ name, img: "", text: "" });
                localStorage.setItem('kochbuch_daten', JSON.stringify(speisen));
                render();
                document.getElementById('foodName').value = "";
            }
        }

        function deleteFood(cat, index) {
            if(confirm("Löschen?")) {
                speisen[cat].splice(index, 1);
                localStorage.setItem('kochbuch_daten', JSON.stringify(speisen));
                render();
            }
        }

        function closeEditor() { document.getElementById('editorModal').style.display = "none"; }
        function closeView() { document.getElementById('viewModal').style.display = "none"; }

        render();
    </script>
</body>
</html>
