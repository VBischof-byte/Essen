<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Speisenauswahl</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .input-section { 
            max-width: 800px; margin: 0 auto 30px; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-add { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .column { background: white; padding: 20px; border-radius: 12px; flex: 1; min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 3px solid #27ae60; padding-bottom: 10px; color: #2c3e50; margin-top: 0; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .item-text { cursor: pointer; display: flex; align-items: center; gap: 8px; flex-grow: 1; }
        .recipe-link { color: #2980b9; font-size: 1.2em; }
        .btn-delete { background: #ff4757; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 85%; margin-top: 50px; border: 4px solid white; border-radius: 8px; }
        .close { position: absolute; top: 20px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Speisenauswahl</h1>

    <div class="input-section">
        <input type="text" id="foodName" placeholder="Neues Gericht">
        <select id="foodCategory">
            <option value="herzhaft">Herzhaft</option>
            <option value="suess">Süß</option>
        </select>
        <input type="text" id="recipeFile" placeholder="Bildname (z.B. Pizza.jpg)">
        <button class="btn-add" onclick="addFood()">Hinzufügen</button>
    </div>

    <div class="container">
        <div class="column">
            <h2>Herzhaft</h2>
            <ul id="herzhaft-list"></ul>
        </div>
        <div class="column">
            <h2>Süß</h2>
            <ul id="suess-list"></ul>
        </div>
    </div>

    <div id="recipeModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="recipeImg">
    </div>

    <script>
        // Deine komplette Liste aus dem Bild
        const standardSpeisen = {
            herzhaft: [
                { name: "TK-Speisen", img: "" },
                { name: "Zucchini", img: "" },
                { name: "Frühlingsrollen", img: "" },
                { name: "Hofmanns", img: "" },
                { name: "Ofengemüse", img: "" },
                { name: "Pizza", img: "Pizza.jpg" },
                { name: "Kartoffelpuffer", img: "" },
                { name: "Selbstgemachte Pizza", img: "" },
                { name: "Nudelauflauf", img: "Nudelauflauf.jpg" },
                { name: "Bratwurst", img: "" },
                { name: "Salat", img: "" },
                { name: "Suppen", img: "" },
                { name: "Steak", img: "" },
                { name: "Kartoffeln mit Quark", img: "" }
            ],
            suess: [
                { name: "Milchreis", img: "Milchreis.JPG" },
                { name: "Griesbrei", img: "Griesbrei.JPG" },
                { name: "Kaiserschmarrn", img: "" },
                { name: "Schmalzgebäck", img: "" },
                { name: "Ofenpfannkuchen", img: "" },
                { name: "Quarkbällchen", img: "" },
                { name: "Waffeln", img: "Waffeln.jpg" },
                { name: "Gebratene Bananen", img: "" }
            ]
        };

        let speisen = JSON.parse(localStorage.getItem('speisenDaten')) || standardSpeisen;

        function render() {
            document.getElementById('herzhaft-list').innerHTML = "";
            document.getElementById('suess-list').innerHTML = "";

            for (let kat in speisen) {
                speisen[kat].forEach((item, index) => {
                    const li = document.createElement('li');
                    const icon = item.img ? '<span class="recipe-link">📖</span>' : '';
                    
                    li.innerHTML = `
                        <div class="item-text" onclick="${item.img ? `openRecipe('${item.img}')` : ''}">
                            ${item.name} ${icon}
                        </div>
                        <button class="btn-delete" onclick="deleteFood('${kat}', ${index})">Löschen</button>
                    `;
                    document.getElementById(kat + '-list').appendChild(li);
                });
            }
        }

        function addFood() {
            const name = document.getElementById('foodName').value;
            const kat = document.getElementById('foodCategory').value;
            const img = document.getElementById('recipeFile').value;
            if (name.trim()) {
                speisen[kat].push({ name, img });
                saveAndRender();
                document.getElementById('foodName').value = "";
                document.getElementById('recipeFile').value = "";
            }
        }

        function deleteFood(kat, index) {
            speisen[kat].splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('speisenDaten', JSON.stringify(speisen));
            render();
        }

        function openRecipe(fileName) {
            document.getElementById('recipeImg').src = fileName;
            document.getElementById('recipeModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('recipeModal').style.display = "none";
        }

        render();
    </script>
</body>
</html>
