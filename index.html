<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Speisenauswahl</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .input-section { 
            max-width: 800px; margin: 0 auto 30px; background: white; padding: 20px; 
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-add { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .column { background: white; padding: 20px; border-radius: 12px; flex: 1; min-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-bottom: 3px solid #27ae60; padding-bottom: 10px; color: #2c3e50; margin-top: 0; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 5px; }
        .row-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .item-text { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .recipe-link { color: #2980b9; font-size: 1.2em; }
        .btn-plus { background: #3498db; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .comment-text { font-size: 0.85em; color: #7f8c8d; font-style: italic; margin-top: 2px; }
        .btn-delete { background: #ff4757; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content-box { background: white; width: 300px; margin: 100px auto; padding: 20px; border-radius: 10px; text-align: center; }
        .modal-img { margin: auto; display: block; max-width: 90%; max-height: 70%; margin-top: 50px; border: 4px solid white; border-radius: 8px; }
        .close { position: absolute; top: 20px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Speisenauswahl</h1>

    <div class="input-section">
        <input type="text" id="foodName" placeholder="Neues Gericht">
        <select id="foodCategory">
            <option value="herzhaft">Herzhaft</option>
            <option value="suess">Süß</option>
        </select>
        <button class="btn-add" onclick="addFood()">Hinzufügen</button>
    </div>

    <div class="container">
        <div class="column">
            <h2>Herzhaft</h2>
            <ul id="herzhaft-list"></ul>
        </div>
        <div class="column">
            <h2>Süß</h2>
            <ul id="suess-list"></ul>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content-box">
            <h3>Bearbeiten</h3>
            <p id="editTargetName" style="font-weight:bold"></p>
            <input type="text" id="editComment" placeholder="Kommentar (z.B. sehr lecker)" style="width:90%"><br><br>
            <input type="text" id="editImg" placeholder="Bildname (z.B. Foto.jpg)" style="width:90%"><br><br>
            <button onclick="saveEdit()">Speichern</button>
            <button onclick="closeEdit()" style="background:#bdc3c7">Abbrechen</button>
        </div>
    </div>

    <div id="recipeModal" class="modal" onclick="this.style.display='none'">
        <span class="close">&times;</span>
        <img class="modal-img" id="recipeImg">
    </div>

    <script>
        // Start-Daten basierend auf deinem Bild
        const standardSpeisen = {
            herzhaft: [
                { name: "Bratwurst", img: "", note: "" },
                { name: "Frühlingsrollen", img: "", note: "" },
                { name: "Hofmanns", img: "", note: "" },
                { name: "Kartoffeln mit Quark", img: "", note: "" },
                { name: "Kartoffelpuffer", img: "", note: "" },
                { name: "Nudelauflauf", img: "", note: "" },
                { name: "Ofengemüse", img: "", note: "" },
                { name: "Pizza", img: "", note: "" },
                { name: "Salat", img: "", note: "" },
                { name: "Selbstgemachte Pizza", img: "", note: "" },
                { name: "Steak", img: "", note: "" },
                { name: "Suppen", img: "", note: "" },
                { name: "TK-Speisen", img: "", note: "" },
                { name: "Zucchini", img: "", note: "" }
            ],
            suess: [
                { name: "Gebratene Bananen", img: "", note: "" },
                { name: "Griesbrei", img: "Griesbrei.jpg", note: "" },
                { name: "Kaiserschmarrn", img: "", note: "" },
                { name: "Milchreis", img: "Milchreis.jpg", note: "" },
                { name: "Ofenpfannkuchen", img: "", note: "" },
                { name: "Quarkbällchen", img: "", note: "" },
                { name: "Schmalzgebäck", img: "", note: "" },
                { name: "Waffeln", img: "", note: "" }
            ]
        };

        let speisen = JSON.parse(localStorage.getItem('speisenDaten')) || standardSpeisen;
        let currentEdit = { cat: '', index: -1 };

        function render() {
            ['herzhaft', 'suess'].forEach(kat => {
                const list = document.getElementById(kat + '-list');
                list.innerHTML = "";
                speisen[kat].sort((a, b) => a.name.localeCompare(b.name));

                speisen[kat].forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="row-top">
                            <div class="item-text" onclick="${item.img ? `openRecipe('${item.img}')` : ''}">
                                ${item.name} ${item.img ? '<span class="recipe-link">📖</span>' : ''}
                                <button class="btn-plus" onclick="event.stopPropagation(); openEdit('${kat}', ${index})">+</button>
                            </div>
                            <button class="btn-delete" onclick="deleteFood('${kat}', ${index})">Löschen</button>
                        </div>
                        ${item.note ? `<div class="comment-text">${item.note}</div>` : ''}
                    `;
                    list.appendChild(li);
                });
            });
        }

        function openEdit(cat, index) {
            currentEdit = { cat, index };
            const item = speisen[cat][index];
            document.getElementById('editTargetName').innerText = item.name;
            document.getElementById('editComment').value = item.note || "";
            document.getElementById('editImg').value = item.img || "";
            document.getElementById('editModal').style.display = "block";
        }

        function saveEdit() {
            const item = speisen[currentEdit.cat][currentEdit.index];
            item.note = document.getElementById('editComment').value;
            item.img = document.getElementById('editImg').value;
            saveAndRender();
            closeEdit();
        }

        function closeEdit() { document.getElementById('editModal').style.display = "none"; }

        function addFood() {
            const name = document.getElementById('foodName').value;
            const kat = document.getElementById('foodCategory').value;
            if (name.trim()) {
                speisen[kat].push({ name, img: "", note: "" });
                saveAndRender();
                document.getElementById('foodName').value = "";
            }
        }

        function deleteFood(kat, index) {
            speisen[kat].splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('speisenDaten', JSON.stringify(speisen));
            render();
        }

        function openRecipe(fileName) {
            document.getElementById('recipeImg').src = fileName;
            document.getElementById('recipeModal').style.display = "block";
        }

        render();
    </script>
</body>
</html>
